<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
<title id="title">H2O Memory: canonical evidence, independent formation and storage</title>
<desc id="desc">Versioned observations and events are the source of record; text, summaries, vectors, graphs, tokens and indices are replaceable derived views. Gas, water and ice are conceptual metaphors for dispersed fragments, assembling evidence and crystallized insight candidates. Epistemic phase and storage tier are independent. Hot, warm and cold concern placement only; cold is an in-process mock. Correction appends a version, stales dependent views and invalidates dependent insights. TRACE retains evidence, uncertainty and counterevidence subject to consent and validity. This reference prototype makes no physical phase-transition or resource-saving claim; vector views are uncomputed stubs.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#547181"/></marker>
 <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7DD5DC"/><stop offset="1" stop-color="#1789A5"/></linearGradient>
 <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E7F8FF"/><stop offset="1" stop-color="#A7CDF6"/></linearGradient>
</defs>
<rect width="1200" height="1060" rx="24" fill="#FAFAF5"/>
