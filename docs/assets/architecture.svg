<text x="44" y="43" font-size="14" font-weight="700" fill="#397183" text-anchor="start" letter-spacing="2">H2O MEMORY / TOPOPHASE</text>
<text x="44" y="89" font-size="36" font-weight="700" fill="#152C43" text-anchor="start">Keep the evidence. Let the views change.</text>
<text x="44" y="120" font-size="19" font-weight="400" fill="#547181" text-anchor="start">A reference architecture for auditable, revisable AI memory</text>
<rect x="44" y="154" width="486" height="150" rx="18" fill="#142E45" stroke="none"/>
<text x="68" y="187" font-size="14" font-weight="700" fill="#92CFD9" text-anchor="start" letter-spacing="1.5">SOURCE OF RECORD</text>
<text x="68" y="222" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">Observations + events</text>
<text x="68" y="254" font-size="18" font-weight="400" fill="#D5E4EB" text-anchor="start">Versioned · provenance-bearing · typed</text>
<text x="68" y="281" font-size="17" font-weight="400" fill="#D5E4EB" text-anchor="start">Time, uncertainty and consent stay attached</text>
<path d="M545 224H638" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/>
<text x="591" y="204" font-size="15" font-weight="400" fill="#547181" text-anchor="middle">derive</text>
<text x="591" y="250" font-size="13" font-weight="400" fill="#547181" text-anchor="middle">if allowed</text>
<rect x="654" y="154" width="502" height="150" rx="18" fill="#FFFFFF" stroke="#CEDDE2"/>
<text x="678" y="187" font-size="14" font-weight="700" fill="#397183" text-anchor="start" letter-spacing="1.5">REPLACEABLE DERIVED VIEWS</text>
<text x="678" y="223" font-size="24" font-weight="700" fill="#152C43" text-anchor="start">Text · summaries · vectors*</text>
<text x="678" y="255" font-size="22" font-weight="400" fill="#152C43" text-anchor="start">Graphs · tokens · search indices</text>
<text x="678" y="282" font-size="16" font-weight="400" fill="#547181" text-anchor="start">Source versions + declared representation loss</text>
<text x="44" y="352" font-size="20" font-weight="700" fill="#168BA2" text-anchor="start">01</text>
<text x="88" y="352" font-size="19" font-weight="700" fill="#152C43" text-anchor="start" letter-spacing="1">EPISTEMIC PHASE</text>
<text x="1156" y="351" font-size="18" font-weight="400" fill="#547181" text-anchor="end">How evidence forms</text>
