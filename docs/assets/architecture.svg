<text x="219" y="574" font-size="13" font-weight="700" fill="#397183" text-anchor="middle" letter-spacing="2">GAS</text>
<text x="219" y="606" font-size="27" font-weight="700" fill="#152C43" text-anchor="middle">dispersed</text>
<text x="219" y="635" font-size="17" font-weight="400" fill="#152C43" text-anchor="middle">Unresolved fragments</text>
<text x="219" y="658" font-size="16" font-weight="400" fill="#547181" text-anchor="middle">available for recombination</text>
<text x="600" y="574" font-size="13" font-weight="700" fill="#397183" text-anchor="middle" letter-spacing="2">WATER</text>
<text x="600" y="606" font-size="27" font-weight="700" fill="#152C43" text-anchor="middle">assembling</text>
<text x="600" y="635" font-size="17" font-weight="400" fill="#152C43" text-anchor="middle">Cue-linked evidence</text>
<text x="600" y="658" font-size="16" font-weight="400" fill="#547181" text-anchor="middle">grouped without rewriting</text>
<text x="981" y="574" font-size="13" font-weight="700" fill="#397183" text-anchor="middle" letter-spacing="2">ICE</text>
<text x="981" y="606" font-size="27" font-weight="700" fill="#152C43" text-anchor="middle">crystallized</text>
<text x="981" y="635" font-size="17" font-weight="400" fill="#152C43" text-anchor="middle">Insight candidates</text>
<text x="981" y="658" font-size="16" font-weight="400" fill="#547181" text-anchor="middle">with uncertainty + falsifiers</text>
<path d="M380 474H437" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M761 474H818" fill="none" stroke="#547181" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600" y="702" font-size="17" font-weight="400" fill="#547181" text-anchor="middle">Conceptual metaphors, not physical states. Reopening can revise formation.</text>
<text x="44" y="753" font-size="20" font-weight="700" fill="#168BA2" text-anchor="start">02</text>
<text x="88" y="753" font-size="19" font-weight="700" fill="#152C43" text-anchor="start" letter-spacing="1">STORAGE TIER</text>
<text x="1156" y="752" font-size="18" font-weight="400" fill="#547181" text-anchor="end">Where records are placed</text>
<rect x="44" y="774" width="1112" height="86" rx="18" fill="#FFFFFF" stroke="#CEDDE2"/>
<text x="82" y="810" font-size="23" font-weight="700" fill="#152C43" text-anchor="start">hot</text>
<text x="82" y="837" font-size="16" font-weight="400" fill="#547181" text-anchor="start">resident</text>
<text x="290" y="810" font-size="23" font-weight="700" fill="#152C43" text-anchor="start">warm</text>
<text x="290" y="837" font-size="16" font-weight="400" fill="#547181" text-anchor="start">working set</text>
<text x="533" y="810" font-size="23" font-weight="700" fill="#152C43" text-anchor="start">cold</text>
<text x="533" y="837" font-size="16" font-weight="400" fill="#547181" text-anchor="start">in-process mock</text>
<path d="M787 793V841" stroke="#CEDDE2"/>
<text x="815" y="811" font-size="20" font-weight="700" fill="#0F778E" text-anchor="start">Independent axes</text>
<text x="815" y="838" font-size="16" font-weight="400" fill="#547181" text-anchor="start">A tier move does not change phase.</text>
<rect x="44" y="886" width="1112" height="119" rx="18" fill="#E7EDF0" stroke="none"/>
<text x="66" y="919" font-size="14" font-weight="700" fill="#397183" text-anchor="start" letter-spacing="1">CORRECT</text>
<text x="209" y="919" font-size="18" font-weight="500" fill="#152C43" text-anchor="start">New version → stale views + invalidated dependent insights</text>
<text x="66" y="952" font-size="14" font-weight="700" fill="#397183" text-anchor="start" letter-spacing="1">TRACE</text>
<text x="209" y="952" font-size="18" font-weight="500" fill="#152C43" text-anchor="start">Evidence, uncertainty and excluded counterevidence</text>
<text x="66" y="984" font-size="17" font-weight="400" fill="#547181" text-anchor="start">Consent, temporal validity, refusal and forgetting govern what can be re-presented.</text>
<text x="44" y="1035" font-size="16" font-weight="400" fill="#547181" text-anchor="start">Prototype boundary: cold is not persistent storage. *Vectors are stubs. No resource-saving claim.</text>
